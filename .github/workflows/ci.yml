name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run build
      - name: Shared pricing navigation regression tests
        run: pnpm run test:pricing-navigation
      - name: Smart TV compatibility regression tests
        run: node --test scripts/smart-tv-compatibility.test.mjs
      - name: WhatsApp attribution and consent regression tests
        run: node --test scripts/whatsapp-placement.test.mjs

      - name: Mobile navigation source and rendered regressions
        run: node --test scripts/mobile-navigation-source.test.mjs scripts/mobile-navigation-rendered.test.mjs
